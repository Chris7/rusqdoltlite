name: CI

on:
  push:
    branches:
      - master
      - gcs
  pull_request:
    branches:
      - master
  schedule:
    - cron: "00 01 * * *"
env:
  RUST_BACKTRACE: short
  # CI builds don't benefit very much from this.
  CARGO_INCREMENTAL: 0
  # We can't use a debugger in CI, and this makes builds faster and the cache
  # smaller. (TODO: use -Cdebuginfo=0 if it doesn't make backtraces useless)
  RUSTFLAGS: -Cdebuginfo=1

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.target }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - target: x86_64-pc-windows-gnu
            os: windows-latest
            host: -x86_64-pc-windows-gnu

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      # This has a matcher for test panics, so we use it even though elsewhere
      # we use actions-rs/toolchain.
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: stable${{ matrix.host }}
          targets: ${{ matrix.target }}
      # The `{ shared-key: ... }` allows different actions to share the cache.
      # We're using a `fullBuild` key mostly as a "this needs to do the
      # complete" that needs to do the complete build (that is, including
      # `--features 'bundled-full session buildtime_bindgen preupdate_hook'`), which is very
      # slow, and has several deps.
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: fullBuild }

      - run: cargo build --features bundled --workspace --all-targets --verbose
      - run: cargo test --features bundled --workspace --all-targets --verbose
      - run: cargo test --features bundled --workspace --doc --verbose

      # This fork always links against DoltLite on native targets; a
      # no-default-features build instead expects a system `libdoltlite`, which
      # GitHub-hosted runners do not provide.

      - name: Add llvm path on Windows
        if: matrix.os == 'windows-latest'
        run: echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - run: cargo test --features 'bundled-full session buildtime_bindgen fallible_uint preupdate_hook' --all-targets --workspace --verbose
      - run: cargo test --features 'bundled-full session buildtime_bindgen fallible_uint preupdate_hook' --doc --workspace --verbose

      - name: loadable extension
        run: |
          cargo build --example loadable_extension --features "loadable_extension functions trace"
          cargo run --example load_extension --features "load_extension bundled functions trace"

      - name: macros
        run: |
          cargo test --package rusqlite-macros
          cargo test --features 'bundled rusqlite-macros'

      # TODO: move into own action for better caching
      - name: Static build
        # Do we expect this to work / should we test with gnu toolchain?
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          RUSTFLAGS: -Ctarget-feature=+crt-static -Cdebuginfo=1
        run: cargo build --features bundled

  blockcachevfs-backends:
    name: Blockcache VFS backends
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: stable
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: blockcachevfs }
      - name: Install blockcachevfs test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libcurl4-openssl-dev libssl-dev pkg-config tcl-dev
      - name: Locate Tcl headers
        shell: bash
        run: |
          set -euo pipefail
          tcl_header="$(find /usr/include /usr/local/include -type f -name tcl.h -print -quit 2>/dev/null || true)"
          if [ -z "$tcl_header" ]; then
            echo "tcl.h was not found after installing tcl-dev" >&2
            exit 1
          fi
          tcl_include="$(dirname "$tcl_header")"
          existing_cppflags="${CPPFLAGS:-}"
          if [ -n "$existing_cppflags" ]; then
            printf 'CPPFLAGS=%s -I%s\n' "$existing_cppflags" "$tcl_include" >> "$GITHUB_ENV"
          else
            printf 'CPPFLAGS=-I%s\n' "$tcl_include" >> "$GITHUB_ENV"
          fi
      - name: Rust blockcachevfs feature tests
        run: cargo test --workspace --features blockcachevfs --all-targets --verbose
      - name: Rust remote server VFS tests
        run: cargo test --features 'blockcachevfs remote' --test remote_server --verbose
      - name: Start pinned emulator containers
        run: |
          set -euo pipefail
          docker run --detach \
            --name rusqdoltlite-blockcache-gcs \
            --publish 4443:4443 \
            fsouza/fake-gcs-server:1.54.0 \
            -scheme http -port 4443 -backend memory
          docker run --detach \
            --name rusqdoltlite-blockcache-s3 \
            --publish 4566:4566 \
            --env FLOCI_SERVICES_S3_ENFORCE_AUTH=true \
            floci/floci:2.1.0
      - name: Wait for emulator readiness
        id: emulator_readiness
        shell: bash
        run: |
          set -euo pipefail
          gcs_ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:4443/storage/v1/b >/dev/null; then
              gcs_ready=1
              break
            fi
            sleep 1
          done
          if [ "$gcs_ready" -ne 1 ]; then
            docker logs rusqdoltlite-blockcache-gcs
            exit 1
          fi

          s3_ready=0
          for _ in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 2 \
              --output /dev/null http://127.0.0.1:4566/_localstack/health; then
              s3_ready=1
              break
            fi
            sleep 1
          done
          if [ "$s3_ready" -ne 1 ]; then
            docker logs rusqdoltlite-blockcache-s3
            exit 1
          fi
      - name: Rust bootstrap test against Google JSON
        if: always() && steps.emulator_readiness.outcome == 'success'
        env:
          BLOCKCACHEVFS_GCS_EMULATOR: http://127.0.0.1:4443
        run: cargo test --test blockcachevfs_emulator --features blockcachevfs -- --ignored --exact google_json_emulator_bootstrap
      - name: Rust bootstrap test against S3
        if: always() && steps.emulator_readiness.outcome == 'success'
        env:
          BLOCKCACHEVFS_S3_EMULATOR: http://127.0.0.1:4566
        run: cargo test --test blockcachevfs_emulator --features blockcachevfs -- --ignored --exact s3_emulator_bootstrap
      - name: Run shared CBS suite against Google JSON
        if: always() && steps.emulator_readiness.outcome == 'success'
        env:
          BLOCKCACHEVFS_GOOGLE_JSON_ENDPOINT: http://127.0.0.1:4443
          BLOCKCACHEVFS_GOOGLE_PROJECT: test-project
          BLOCKCACHEVFS_GOOGLE_TOKEN: test-token
        run: tools/run_blockcachevfs_cbs_tests
      - name: Run shared CBS suite against S3
        if: always() && steps.emulator_readiness.outcome == 'success'
        env:
          BLOCKCACHEVFS_S3_ENDPOINT: http://127.0.0.1:4566
          BLOCKCACHEVFS_S3_ACCESS_KEY: test
          BLOCKCACHEVFS_S3_SECRET: test
          BLOCKCACHEVFS_S3_REGION: us-east-1
        run: tools/run_blockcachevfs_cbs_tests
      - name: Emulator logs and cleanup
        if: always()
        run: |
          docker ps -a --filter name=rusqdoltlite-blockcache || true
          docker logs rusqdoltlite-blockcache-gcs || true
          docker logs rusqdoltlite-blockcache-s3 || true
          docker rm --force rusqdoltlite-blockcache-gcs rusqdoltlite-blockcache-s3 || true

  test-sqlite-wasm:
    name: Test wasm32-unknown-unknown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Test unit and integration tests
        run: wasm-pack test --node --features modern-full

  sanitizer:
    name: Address Sanitizer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Need nightly rust.
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Tests with asan
        env:
          RUSTFLAGS: -Zsanitizer=address -Cdebuginfo=0
          RUSTDOCFLAGS: -Zsanitizer=address
          ASAN_OPTIONS: "detect_stack_use_after_return=1:detect_leaks=0"
          # Work around https://github.com/rust-lang/rust/issues/59125 by
          # disabling backtraces. In an ideal world we'd probably suppress the
          # leak sanitization, but we don't care about backtraces here, so long
          # as the other tests have them.
          RUST_BACKTRACE: "0"
        run: cargo -Z build-std test --features 'bundled-full session buildtime_bindgen preupdate_hook with-asan' --target x86_64-unknown-linux-gnu

  direct-minimal-versions:
    name: Test min versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo update -Z direct-minimal-versions
      - run: cargo test --workspace --all-targets --features bundled-full

  # Ensure clippy doesn't complain.
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hecrj/setup-rust-action@v2
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --workspace --features bundled -- -D warnings
      # Clippy with all non-conflicting features
      - run: cargo clippy --all-targets --workspace --features 'bundled-full session buildtime_bindgen preupdate_hook' -- -D warnings

  # Ensure miri doesn't complain.
  miri:
    name: Miri
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: nightly
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo miri test --lib --features bundled-full

  # Ensure patch is formatted.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hecrj/setup-rust-action@v2
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Detect cases where documentation links don't resolve and such.
  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: hecrj/setup-rust-action@v2
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: fullBuild }
      - run: cargo doc --features 'bundled-full session buildtime_bindgen fallible_uint preupdate_hook' --no-deps
        env: { RUSTDOCFLAGS: -Dwarnings }
