name: Remote server

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: remote-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  remote-server:
    name: Remote tests (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux with blockcachevfs
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: blockcachevfs remote
            blockcachevfs: true
          - name: macOS with blockcachevfs
            os: macos-latest
            target: x86_64-apple-darwin
            features: blockcachevfs remote
            blockcachevfs: true
          - name: Windows MSVC with blockcachevfs
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_host: -x86_64-pc-windows-msvc
            features: blockcachevfs remote
            blockcachevfs: true
          - name: Windows GNU remote server
            os: windows-latest
            target: x86_64-pc-windows-gnu
            rust_host: -x86_64-pc-windows-gnu
            features: remote
            blockcachevfs: false

    steps:
      - uses: actions/checkout@v6
      - uses: hecrj/setup-rust-action@v2
        with:
          rust-version: stable${{ matrix.rust_host }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: remote-server-${{ matrix.target }}
          cache-on-failure: true

      - name: Select native Perl for vendored OpenSSL
        if: runner.os == 'Windows' && matrix.blockcachevfs
        shell: pwsh
        run: |
          # The Git Bash Perl can be first on PATH but lacks modules used by openssl-src.
          $perlCandidates = @(
            Get-Command perl.exe -All -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandType -eq 'Application' -and $_.Source } |
              Select-Object -ExpandProperty Source -Unique
          )

          if ($perlCandidates.Count -eq 0) {
            throw 'No perl.exe executable was found on the Windows runner PATH.'
          }

          $selectedPerl = $null
          $moduleFailures = @()
          foreach ($candidate in $perlCandidates) {
            $platform = (& $candidate -MConfig -e 'print $^O' 2>&1 | Out-String).Trim()
            $platformExitCode = $LASTEXITCODE
            if ($platformExitCode -ne 0 -or $platform -ne 'MSWin32') {
              continue
            }

            $moduleOutput = (& $candidate -MLocale::Maketext::Simple -MIPC::Cmd -e '1' 2>&1 | Out-String).Trim()
            $moduleExitCode = $LASTEXITCODE
            if ($moduleExitCode -eq 0) {
              $selectedPerl = $candidate
              break
            }

            $moduleFailures += "$candidate`: $moduleOutput"
          }

          if (-not $selectedPerl) {
            if ($moduleFailures.Count -gt 0) {
              throw "Native Windows Perl was found, but OpenSSL requires Locale::Maketext::Simple and IPC::Cmd. $($moduleFailures -join '; ')"
            }

            throw 'No native Windows Perl executable was found among perl.exe candidates.'
          }

          [System.IO.File]::AppendAllText(
            $env:GITHUB_ENV,
            "OPENSSL_SRC_PERL=$selectedPerl`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          Write-Host "Using native Windows Perl: $selectedPerl"

      - name: Add MinGW compiler tools
        if: matrix.target == 'x86_64-pc-windows-gnu'
        shell: pwsh
        run: |
          "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run remote server and progress integration tests
        run: cargo test --target '${{ matrix.target }}' --features '${{ matrix.features }}' --test remote_server --test remote_progress --verbose
